<!doctype html><meta charset="utf-8"><title>Buoy brand</title>
<link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@600;800&display=swap" rel="stylesheet">

<div class="col"><div class="icon"><img src="app-icon.svg"></div>App icon 1024<div class="small"><img src="app-icon.svg" style="width:100%;height:100%"></div>Home screen 60pt</div>
<div class="col"><div class="splash"><img src="splash.svg" style="width:100%;height:100%"></div>Splash 393×852</div>
<div class="col"><img src="mark.svg" width="200">Mark</div>
